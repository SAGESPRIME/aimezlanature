<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #f4efe4; }
      #root { position: relative; width: 100%; height: 100%; }
      #scene { position: absolute; inset: 0; width: 1080px; height: 1080px; }
    </style>
  </head>
  <body>
    <!--
      Vidéo du haut de l'accueil : des perles de céramique EM tombent dans une
      carafe d'eau, éclaboussent, puis reposent au fond. Dessin canvas, chaque
      image calculée à partir du temps seul (aucun hasard non semé, aucun
      minuteur) : le rendu est identique à chaque fois. 1080 × 1080, 6,5 s,
      la dernière image (eau calme, perles au fond) sert d'affiche.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.5"
      data-width="1080"
      data-height="1080"
    >
      <canvas id="scene" class="clip" data-start="0" data-duration="6.5" data-track-index="0" width="1080" height="1080"></canvas>
    </div>
    <script>
      (function () {
        const W = 1080, H = 1080;
        const cv = document.getElementById("scene");
        const c = cv.getContext("2d");

        // ── Hasard semé (mulberry32) ─────────────────────────────────────────
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rnd = mulberry32(20261125);

        // ── Géométrie de la carafe ───────────────────────────────────────────
        const CX = 540;
        const NECK_L = 450, NECK_R = 630, LIP_Y = 250, NECK_Y = 340;
        const BODY_L = 330, BODY_R = 750, SHOULDER_Y = 480, BOTTOM_Y = 930, R = 64;
        const LEVEL = 560; // surface de l'eau au repos
        const G = 2600; // gravité (px/s²)

        function carafePath(inset) {
          const i = inset;
          c.beginPath();
          c.moveTo(NECK_L + i, LIP_Y);
          c.lineTo(NECK_L + i, NECK_Y);
          c.bezierCurveTo(NECK_L + i, 400, BODY_L + i, 410, BODY_L + i, SHOULDER_Y);
          c.lineTo(BODY_L + i, BOTTOM_Y - R);
          c.quadraticCurveTo(BODY_L + i, BOTTOM_Y - i, BODY_L + R, BOTTOM_Y - i);
          c.lineTo(BODY_R - R, BOTTOM_Y - i);
          c.quadraticCurveTo(BODY_R - i, BOTTOM_Y - i, BODY_R - i, BOTTOM_Y - R);
          c.lineTo(BODY_R - i, SHOULDER_Y);
          c.bezierCurveTo(BODY_R - i, 410, NECK_R - i, 400, NECK_R - i, NECK_Y);
          c.lineTo(NECK_R - i, LIP_Y);
        }

        // ── Les perles : chute, impact, descente, repos (précalculé) ────────
        const RESTS = [
          [400, 900], [452, 906], [506, 902], [560, 907], [614, 901], [668, 905],
          [428, 874], [484, 878], [540, 872], [596, 879], [652, 875],
        ];
        const N = RESTS.length;
        const beads = [];
        for (let k = 0; k < N; k++) {
          const t0 = 0.2 + k * 0.27 + (rnd() - 0.5) * 0.08;
          const x0 = CX + (rnd() - 0.5) * 90;
          const y0 = -60;
          const tImpact = t0 + Math.sqrt((2 * (LEVEL - y0)) / G);
          const vImpact = G * (tImpact - t0);
          beads.push({
            t0, x0, y0, tImpact, vImpact,
            xr: RESTS[k][0], yr: RESTS[k][1],
            rot0: rnd() * Math.PI, spin: (rnd() - 0.5) * 9, rotR: (rnd() - 0.5) * 0.5,
            w: 44 + rnd() * 8, h: 28 + rnd() * 4,
            tone: rnd(),
            drops: Array.from({ length: 22 }, () => {
              const a = -Math.PI / 2 + (rnd() - 0.5) * 2.4;
              const v = 420 + rnd() * 560;
              return { vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 3.5 + rnd() * 6 };
            }),
            bubbles: Array.from({ length: 7 }, (_, j) => ({ dt: 0.05 + j * 0.07 + rnd() * 0.05, dx: (rnd() - 0.5) * 30, r: 2 + rnd() * 4, ph: rnd() * 6 })),
          });
        }
        const SINK = 2.6; // vitesse d'amortissement de la descente

        function beadState(b, t) {
          if (t < b.t0) return null;
          if (t < b.tImpact) {
            const d = t - b.t0;
            return { x: b.x0, y: b.y0 + 0.5 * G * d * d, a: b.rot0 + b.spin * d, inWater: false };
          }
          const d = t - b.tImpact;
          const e = 1 - Math.exp(-SINK * d);
          const x = b.x0 + (b.xr - b.x0) * e + Math.sin(d * 5) * 10 * Math.exp(-2 * d);
          const y = LEVEL + (b.yr - LEVEL) * e;
          const aFall = b.rot0 + b.spin * (b.tImpact - b.t0);
          const a = aFall + (b.rotR - aFall) * e;
          return { x, y, a, inWater: true };
        }

        // ── Surface : ondes des impacts ─────────────────────────────────────
        function surfaceY(x, t) {
          let y = LEVEL;
          for (const b of beads) {
            const d = t - b.tImpact;
            if (d <= 0) continue;
            const dist = Math.abs(x - b.x0);
            const front = 520 * d;
            if (dist > front) continue;
            const amp = 11 * Math.exp(-2.4 * d) * Math.exp(-dist / 260);
            y += amp * Math.cos(0.055 * dist - 14 * d);
          }
          return y;
        }

        function drawBead(x, y, a, w, h, tone, alpha) {
          c.save();
          c.globalAlpha = alpha;
          c.translate(x, y);
          c.rotate(a);
          const base = tone < 0.5 ? ["#c9bfae", "#8d8373"] : ["#bdb4a6", "#7f776b"];
          const g = c.createLinearGradient(0, -h / 2, 0, h / 2);
          g.addColorStop(0, base[0]);
          g.addColorStop(1, base[1]);
          c.fillStyle = g;
          c.beginPath();
          const r = h / 2;
          c.moveTo(-w / 2 + r, -r);
          c.lineTo(w / 2 - r, -r);
          c.arc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2);
          c.lineTo(-w / 2 + r, r);
          c.arc(-w / 2 + r, 0, r, Math.PI / 2, (3 * Math.PI) / 2);
          c.closePath();
          c.fill();
          c.fillStyle = "rgba(255,255,255,0.35)";
          c.beginPath();
          c.ellipse(-w * 0.12, -h * 0.22, w * 0.26, h * 0.12, 0, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }

        // ── Une image, pour le temps t ──────────────────────────────────────
        function render(t) {
          // Fond chaud + halo anis, comme les arches du site
          c.fillStyle = "#f4efe4";
          c.fillRect(0, 0, W, H);
          const halo = c.createRadialGradient(560, 560, 60, 560, 580, 470);
          halo.addColorStop(0, "rgba(214, 236, 150, 0.55)");
          halo.addColorStop(1, "rgba(214, 236, 150, 0)");
          c.fillStyle = halo;
          c.fillRect(0, 0, W, H);

          // Ombre portée
          c.fillStyle = "rgba(60, 50, 40, 0.14)";
          c.beginPath();
          c.ellipse(CX + 18, BOTTOM_Y + 18, 270, 26, 0, 0, Math.PI * 2);
          c.fill();

          // Perles encore en l'air (derrière le verre si au-dessus du goulot)
          for (const b of beads) {
            const s = beadState(b, t);
            if (s && !s.inWater && s.y < LIP_Y + 10) drawBead(s.x, s.y, s.a, b.w, b.h, b.tone, 1);
          }

          // Corps de verre (léger voile)
          carafePath(0);
          c.fillStyle = "rgba(255, 255, 255, 0.28)";
          c.fill();

          // Intérieur : eau, perles, bulles, gouttes — découpés dans la carafe
          c.save();
          carafePath(9);
          c.clip();

          // Eau
          c.beginPath();
          c.moveTo(BODY_L - 10, H);
          for (let x = BODY_L - 10; x <= BODY_R + 10; x += 6) c.lineTo(x, surfaceY(x, t));
          c.lineTo(BODY_R + 10, H);
          c.closePath();
          const eau = c.createLinearGradient(0, LEVEL, 0, BOTTOM_Y);
          eau.addColorStop(0, "rgba(170, 214, 222, 0.55)");
          eau.addColorStop(1, "rgba(118, 178, 190, 0.62)");
          c.fillStyle = eau;
          c.fill();

          // Reflet de surface
          c.strokeStyle = "rgba(255, 255, 255, 0.75)";
          c.lineWidth = 3;
          c.beginPath();
          for (let x = BODY_L; x <= BODY_R; x += 6) {
            const y = surfaceY(x, t) + 1;
            if (x === BODY_L) c.moveTo(x, y); else c.lineTo(x, y);
          }
          c.stroke();

          // Perles dans le goulot (en chute) ou dans l'eau
          for (const b of beads) {
            const s = beadState(b, t);
            if (!s) continue;
            if (!s.inWater && s.y >= LIP_Y + 10) drawBead(s.x, s.y, s.a, b.w, b.h, b.tone, 1);
            if (s.inWater) drawBead(s.x, s.y, s.a, b.w, b.h, b.tone, 0.92);
          }

          // Bulles qui remontent derrière chaque perle
          for (const b of beads) {
            for (const q of b.bubbles) {
              const d = t - b.tImpact - q.dt;
              if (d <= 0) continue;
              const s = beadState(b, b.tImpact + q.dt);
              const y = s.y - 150 * d;
              if (y < LEVEL + 4) continue;
              const x = s.x + q.dx + Math.sin(d * 9 + q.ph) * 5;
              c.strokeStyle = "rgba(255, 255, 255, 0.8)";
              c.lineWidth = 1.5;
              c.beginPath();
              c.arc(x, y, q.r, 0, Math.PI * 2);
              c.stroke();
            }
          }

          // Anneaux d'onde à la surface
          for (const b of beads) {
            const d = t - b.tImpact;
            if (d <= 0 || d > 1.2) continue;
            for (let k = 0; k < 2; k++) {
              const dd = d - k * 0.18;
              if (dd <= 0) continue;
              const rx = 14 + 210 * dd;
              c.strokeStyle = `rgba(255, 255, 255, ${0.55 * (1 - dd / 1.2)})`;
              c.lineWidth = 2;
              c.beginPath();
              c.ellipse(b.x0, LEVEL + 2, rx, rx * 0.16, 0, 0, Math.PI * 2);
              c.stroke();
            }
          }

          // Éclaboussures : couronne de gouttes
          for (const b of beads) {
            const d = t - b.tImpact;
            if (d <= 0 || d > 0.8) continue;
            for (const p of b.drops) {
              const x = b.x0 + p.vx * d;
              const y = LEVEL + p.vy * d + 0.5 * 2400 * d * d;
              if (y > LEVEL + 2) continue;
              const al = Math.min(1, 1.1 - d);
              c.fillStyle = `rgba(196, 230, 238, ${al})`;
              c.strokeStyle = `rgba(110, 170, 186, ${0.55 * al})`;
              c.lineWidth = 1.2;
              c.beginPath();
              c.ellipse(x, y, p.r * 0.8, p.r * 1.25, Math.atan2(p.vy + 2400 * d, p.vx) + Math.PI / 2, 0, Math.PI * 2);
              c.fill();
              c.stroke();
            }
            // Couronne d'eau à l'impact
            if (d < 0.32) {
              const k = d / 0.32;
              const cr = 18 + 70 * k, ch = 46 * Math.sin(k * Math.PI);
              c.strokeStyle = `rgba(240, 250, 252, ${0.9 * (1 - k)})`;
              c.lineWidth = 5;
              c.beginPath();
              c.moveTo(b.x0 - cr, LEVEL);
              c.quadraticCurveTo(b.x0 - cr * 0.7, LEVEL - ch, b.x0 - cr * 0.45, LEVEL - ch * 0.8);
              c.moveTo(b.x0 + cr, LEVEL);
              c.quadraticCurveTo(b.x0 + cr * 0.7, LEVEL - ch, b.x0 + cr * 0.45, LEVEL - ch * 0.8);
              c.stroke();
            }
            // Colonne d'eau qui rejaillit
            if (d > 0.12 && d < 0.5) {
              const k = (d - 0.12) / 0.38;
              const hgt = 120 * Math.sin(k * Math.PI);
              c.fillStyle = "rgba(232, 246, 249, 0.9)";
              c.beginPath();
              c.ellipse(b.x0, LEVEL - hgt / 2, 9, hgt / 2 + 3, 0, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(b.x0, LEVEL - hgt - 8, 7 * Math.sin(k * Math.PI), 0, Math.PI * 2);
              c.fill();
            }
          }
          c.restore();

          // Verre : contour et reflets par-dessus
          carafePath(0);
          c.strokeStyle = "rgba(120, 140, 140, 0.55)";
          c.lineWidth = 4;
          c.stroke();
          c.strokeStyle = "rgba(255, 255, 255, 0.9)";
          c.lineWidth = 2;
          carafePath(5);
          c.stroke();
          // Bord du goulot
          c.strokeStyle = "rgba(120, 140, 140, 0.6)";
          c.lineWidth = 4;
          c.beginPath();
          c.ellipse(CX, LIP_Y, (NECK_R - NECK_L) / 2, 12, 0, 0, Math.PI * 2);
          c.stroke();
          // Grands reflets verticaux
          const ref = c.createLinearGradient(BODY_L + 20, 0, BODY_L + 70, 0);
          ref.addColorStop(0, "rgba(255,255,255,0)");
          ref.addColorStop(0.5, "rgba(255,255,255,0.5)");
          ref.addColorStop(1, "rgba(255,255,255,0)");
          c.fillStyle = ref;
          c.fillRect(BODY_L + 20, SHOULDER_Y + 20, 50, BOTTOM_Y - SHOULDER_Y - 90);
          c.fillStyle = "rgba(255,255,255,0.35)";
          c.fillRect(BODY_R - 46, SHOULDER_Y + 40, 10, BOTTOM_Y - SHOULDER_Y - 140);
        }

        // Temps piloté par une timeline GSAP en pause (contrat HyperFrames)
        const etat = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(etat, { t: 6.5, duration: 6.5, ease: "none", onUpdate: () => render(etat.t) }, 0);
        window.addEventListener("hf-seek", (e) => render(e.detail.time));
        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
